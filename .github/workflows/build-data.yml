name: Régénérer les données et les duels

# Déclenchement automatique chaque lundi à 6 h UTC (7 h ou 8 h à Paris), sur le dernier commit du dump ;
# ne fait aucun commit si le dump n'a pas changé. Déclenchement manuel possible aussi
# (onglet Actions > « Régénérer les données et les duels » > Run workflow).
# GitHub suspend les tâches planifiées d'un dépôt sans activité depuis 60 jours : les réactiver dans l'onglet Actions.
on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:
    inputs:
      dump_commit:
        description: "Commit du dump wh3-dump à utiliser (vide = dernier commit). Le fixer garantit qu'une version du site ne mélange jamais deux versions du jeu."
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Récupérer le dump des tables du jeu (Shazbot/wh3-dump)
        run: |
          if [ -n "$DUMP_COMMIT" ]; then
            git init "$RUNNER_TEMP/wh3-dump"
            git -C "$RUNNER_TEMP/wh3-dump" fetch --depth 1 https://github.com/Shazbot/wh3-dump "$DUMP_COMMIT"
            git -C "$RUNNER_TEMP/wh3-dump" checkout FETCH_HEAD
          else
            git clone --depth 1 https://github.com/Shazbot/wh3-dump "$RUNNER_TEMP/wh3-dump"
          fi
          git -C "$RUNNER_TEMP/wh3-dump" log -1 --format='Dump utilisé : %H %cI %s'
        env:
          GIT_LFS_SKIP_SMUDGE: "1"
          DUMP_COMMIT: ${{ github.event.inputs.dump_commit }}

      - name: Convertir les tables en data/units.js
        run: python3 tools/convert_rpfm.py "$RUNNER_TEMP/wh3-dump"

      - name: Calculer les duels (même simulateur sim.js que le site)
        run: node tools/build_duels.js

      - name: Enregistrer les fichiers générés
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/units.js data/units.json data/duels.js data/effects.js
          if ! git diff --cached --quiet; then
            git commit -m "Données et duels régénérés"
            git push
          else
            echo "Aucun changement."
          fi
